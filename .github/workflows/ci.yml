name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # The same script contributors run locally. If it passes here and fails there,
      # that is a bug in the script, not a difference to work around.
      - name: Run the full check
        # CI has the machine to itself, so it runs the UI tests too.
        run: RUN_UI_TESTS=1 bash scripts/check.sh

  secrets:
    name: no secrets in the diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRs never get a real API key. Every test in this repository runs against
      # mocks and fixtures, so there is nothing for a fork to exfiltrate — and no
      # secret is exposed to pull_request workflows.
      - name: Scan the diff for key-shaped strings
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          added=$(git diff "$base"...HEAD --unified=0 | grep '^+' || true)
          if echo "$added" \
            | grep -vE 'not-a-real-key' \
            | grep -qE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})'; then
            echo "A key-shaped string was added. If it is a deliberate test fixture,"
            echo "annotate the line with 'not-a-real-key'."
            exit 1
          fi
          echo "clean"

  licence:
    name: licence boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rant is MIT; VoiceInk is GPLv3. Copying in that direction is not permitted.
      #
      # This used to grep for the *name*, which could never pass: `VoiceInkAdapter` is
      # a legitimate class that reads VoiceInk's exports, and the Migration screen
      # names the product in its own copy. A name is not evidence of copied code, and
      # a check that cannot pass is a check people delete.
      #
      # What a grep can honestly detect is a copied licence header — which is what
      # actually travels with copied GPL source — and whether the boundary is still
      # documented. See docs/DECISIONS.md D-001.
      - name: No GPL-licensed source in the tree
        run: |
          if grep -rniE 'GNU General Public License|GPL-3\.0|gplv3' Sources/ App/ 2>/dev/null; then
            echo "A GPL licence header appeared in source. Rant is MIT; GPLv3 code"
            echo "cannot be copied into it — behaviour may be studied, code may not."
            exit 1
          fi
          grep -qi 'No GPL-licensed source code' THIRD_PARTY_NOTICES.md || {
            echo "THIRD_PARTY_NOTICES.md no longer records the GPL boundary."
            exit 1
          }
          echo "clean"
