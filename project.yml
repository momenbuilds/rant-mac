name: Rant
options:
  bundleIdPrefix: dev.rant
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing so a contributor with no Apple Developer account can still build
    # and run. Replace with a Developer ID for distribution; see docs/PACKAGING.md.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: Rant
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

packages:
  RantCore:
    path: .

targets:
  Rant:
    type: application
    platform: macOS
    sources:
      - path: App/Rant
    dependencies:
      - package: RantCore
        product: RantCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rant.mac
        INFOPLIST_FILE: App/Rant/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Rant/Rant.entitlements
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          # A separate identity so a development build sits beside a release build
          # instead of replacing it — and, more importantly, so the two do not fight
          # over the same Accessibility grant.
          PRODUCT_BUNDLE_IDENTIFIER: dev.rant.mac.dev
          PRODUCT_NAME: Rant Dev
schemes:
  Rant:
    build:
      targets:
        Rant: all
    run:
      config: Debug
    archive:
      config: Release
