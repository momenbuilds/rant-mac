name: Rant
options:
  bundleIdPrefix: dev.rant
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing so a contributor with no Apple Developer account can still build
    # and run. Replace with a Developer ID for distribution; see docs/PACKAGING.md.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    # Build for both architectures in Release, so one download runs on an Apple
    # Silicon Mac and on an Intel one. Debug stays native for build speed.
    ONLY_ACTIVE_ARCH: YES
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: Rant

packages:
  RantCore:
    path: .

targets:
  Rant:
    type: application
    platform: macOS
    sources:
      - path: App/Rant
    dependencies:
      - package: RantCore
        product: RantCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rant.mac
        INFOPLIST_FILE: App/Rant/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Rant/Rant.entitlements
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
        Debug:
          # A separate identity so a development build sits beside a release build
          # instead of replacing it — and, more importantly, so the two do not fight
          # over the same Accessibility grant.
          PRODUCT_BUNDLE_IDENTIFIER: dev.rant.mac.dev
          PRODUCT_NAME: Rant Dev
  RantUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/RantUITests
    dependencies:
      - target: Rant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rant.mac.uitests
        TEST_TARGET_NAME: Rant
        GENERATE_INFOPLIST_FILE: YES
        # Without this the bundle inherits PRODUCT_NAME: Rant from the base settings
        # and the runner tries to dlopen a binary with the same name as the app,
        # which fails on a team-ID mismatch under ad-hoc signing.
        PRODUCT_NAME: RantUITests
        # The base settings sign everything ad-hoc so contributors without an Apple
        # Developer account can build. That is wrong for a test bundle: XCTRunner.app
        # is signed by Apple, and dlopen refuses to map an ad-hoc bundle into it
        # ("different Team IDs"). Leaving the test bundle unsigned lets the runner
        # load it.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  Rant:
    build:
      targets:
        Rant: all
        RantUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RantUITests
    archive:
      config: Release
